name: Backend and browser checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adarsh maurya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -B -m unittest discover -s backend -p test_backend.py -v
      - run: python -B backend/legacy_smoke.py
      - run: node --check frontend/js/app.js
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/test_ui.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test_only
          POSTGRES_DB: iris_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iris -d iris_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: adarsh maurya
    env:
      IRIS_TEST_POSTGRES_URL: postgresql://iris:iris_test_only@localhost:5432/iris_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -B -m unittest discover -s backend -p test_postgres.py -v
