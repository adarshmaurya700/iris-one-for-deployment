<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="irisBirdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#E0B84C"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="birdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E0B84C" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#birdGlow)">
    <!-- Bird Outline, Back and Wing Loop -->
    <path d="M58 14 C65 14, 76 18, 88 24 C80 27, 72 31, 68 38 C64 47, 65 60, 56 74 C54 77, 53 82, 54 88 C49 83, 44 80, 39 80 C34 80, 27 86, 21 91 C27 81, 31 71, 36 63 C28 58, 22 49, 21 38 C20 26, 28 17, 39 19 C48 21, 52 28, 52 35 C52 44, 43 51, 34 56" 
          stroke="url(#irisBirdGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Diagonal Inner Wing Fold Quill Line -->
    <path d="M41 24 L27 60" stroke="url(#irisBirdGold)" stroke-width="3.8" stroke-linecap="round"/>
    <!-- Swallowtail Inner Notch -->
    <path d="M39 80 C44 76, 49 76, 54 82" stroke="url(#irisBirdGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="63" cy="22" r="2.2" fill="url(#irisBirdGold)"/>
  </g>
</svg>
